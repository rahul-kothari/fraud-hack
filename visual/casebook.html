<meta charset="utf-8">
<title>Screening Casebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: alert list on the left, one case on the right told as a story (two sides, numbered steps, hints), raw rows last. */
:root{
  --bg:#f5f6f8; --side:#eceef3; --panel:#ffffff; --fg:#1b2130; --muted:#5d6577; --line:#d5d9e2;
  --accent:#1f4fa8; --accent-soft:#e4ebf8;
  --ok:#1d7a4c; --ok-soft:#e2f3ea; --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b0362b; --bad-soft:#fbe5e2; --off:#7f8697; --off-soft:#eceef2;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151d; --side:#0d1118; --panel:#181d27; --fg:#e4e8f0; --muted:#9aa3b5; --line:#2c3341;
  --accent:#7ea6f0; --accent-soft:#1e2b45;
  --ok:#5fc796; --ok-soft:#173226; --warn:#e6b05a; --warn-soft:#3a2c14; --bad:#f08a7e; --bad-soft:#3d1f1c; --off:#7c8496; --off-soft:#212734; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --side:#0d1118; --panel:#181d27; --fg:#e4e8f0; --muted:#9aa3b5; --line:#2c3341;
  --accent:#7ea6f0; --accent-soft:#1e2b45;
  --ok:#5fc796; --ok-soft:#173226; --warn:#e6b05a; --warn-soft:#3a2c14; --bad:#f08a7e; --bad-soft:#3d1f1c; --off:#7c8496; --off-soft:#212734; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:1.9rem;line-height:1.18}
.caseid{font-family:var(--f-mono);font-size:.9rem;color:var(--muted);margin-top:-4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
h4{font-size:.95rem;color:var(--muted)}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* app shell */
[hidden]{display:none!important}
:root{--nav-h:52px}
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:4px;height:var(--nav-h);background:var(--panel);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--panel)}
.topnav .navbrand{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin-right:16px;white-space:nowrap}
.topnav a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:6px;font-size:.92rem;font-weight:500;white-space:nowrap}
.topnav a:hover{color:var(--fg)}
.topnav a[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
.soon{display:inline-block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:99px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:1px}
.page{max-width:1020px;margin:0 auto;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:36px}
.ov-head{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:24px}
.ov-head h1{font-size:2.4rem;max-width:22ch}
.ov-words{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.ov-words span{font-family:var(--f-display);font-size:1.15rem;font-weight:600;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);padding:6px 18px;border-radius:99px}
.ov-diagram{overflow-x:auto}
.ov-diagram svg{display:block;width:100%;min-width:640px;height:auto}
.ov-box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.ov-ai{fill:var(--accent-soft);stroke:var(--accent)}
.ov-title{fill:var(--fg);font-family:var(--f-display);font-weight:600;font-size:22px}
.ov-sub{fill:var(--muted);font-family:var(--f-body);font-size:15px;text-anchor:middle}
.ov-q{fill:var(--bg);stroke:var(--muted);stroke-width:1.3}
.ov-qt{fill:var(--fg);font-family:var(--f-body);font-weight:600;font-size:16px;text-anchor:middle}
.ov-leaf{stroke-width:1.3}
.ov-lt{font-family:var(--f-mono);font-weight:500;font-size:13px;text-anchor:middle}
.ov-d{fill:var(--ok-soft);stroke:var(--ok)} .ov-d + .ov-lt{fill:var(--ok)}
.ov-s{fill:var(--bad-soft);stroke:var(--bad)} .ov-s + .ov-lt{fill:var(--bad)}
.ov-r{fill:var(--warn-soft);stroke:var(--warn)} .ov-r + .ov-lt{fill:var(--warn)}
.ov-yn{fill:var(--muted);font-family:var(--f-mono);font-size:13px;text-anchor:middle}
.ov-edge{fill:none;stroke:var(--muted);stroke-width:1.6}
.ov-tip{fill:var(--muted)}
.ov-loop{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:7 5}
.ov-tip-ai{fill:var(--accent)}
.ov-loopt{fill:var(--accent);font-family:var(--f-display);font-weight:600;font-size:16px;text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:8px}
.ov-axis{stroke:var(--line);stroke-width:1.5}
.ov-bl{fill:var(--fg);font-family:var(--f-body);font-size:14px}
.ov-pos{fill:var(--bad)}
.ov-neg{fill:var(--ok)}
.ov-dot{fill:var(--accent)}
.ov-pt{fill:var(--fg);font-family:var(--f-body);font-size:15px}
.app{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - var(--nav-h))}
.side{position:sticky;top:calc(var(--nav-h) + env(safe-area-inset-top,0px));height:calc(100vh - var(--nav-h) - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line);min-width:0}
.side-head{padding:20px 16px 12px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.3rem}
.side input[type=search]{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);font:inherit;font-size:.9rem}
.list{list-style:none;margin:0;padding:6px 8px 24px;overflow:auto;flex:1;min-height:0}
.list a{display:grid;gap:1px;padding:7px 10px;border-radius:6px;text-decoration:none;color:inherit}
.list a:hover{background:var(--panel)}
.list a[aria-current=true]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.li-name{font-size:.9rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-meta{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.li-tags{display:flex;gap:6px;align-items:center;margin:2px 0 1px}
.list .empty{padding:12px;color:var(--muted);font-size:.9rem}
main{min-width:0}
.case{max-width:1020px;margin:0 auto;padding:28px 28px 72px;display:grid;gap:30px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .list{max-height:38vh}
  .case{padding:22px 16px 64px}
}

/* case header */
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
header.ch{display:grid;gap:10px}
.lede{max-width:72ch;color:var(--muted)}
.flag{border-radius:6px;padding:8px 12px;font-size:.88rem;max-width:76ch}
.flag.warn{background:var(--warn-soft)}
.flag.bad{background:var(--bad-soft)}
.badge{display:inline-block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:4px;vertical-align:2px}
.badge.key{background:var(--warn-soft);color:var(--warn)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;text-align:left;display:grid;gap:0;max-width:280px}
.tabs button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.tabs .t1{font-size:.88rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs .t2{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.tabrow{display:grid;gap:6px}

/* the two sides */
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:stretch}
.person{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:9px;align-content:start;min-width:0}
.person.cust{border-top:4px solid var(--accent)}
.person.hit{border-top:4px solid var(--warn)}
.person .role{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.person.cust .role{color:var(--accent)}
.person.hit .role{color:var(--warn)}
.person .who{font-family:var(--f-display);font-size:1.3rem;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.person ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:.9rem}
.person li{overflow-wrap:anywhere}
.person .src{font-size:.76rem;color:var(--muted);font-family:var(--f-mono);overflow-wrap:anywhere}
.cathelp{background:var(--warn-soft);border-radius:6px;padding:6px 10px;font-size:.82rem}
.manual > summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.25rem;padding:4px 0}
.manual > .body{display:grid;gap:30px;padding-top:18px}
@media (max-width:760px){.duo{grid-template-columns:1fr}}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px 18px 62px;position:relative;display:grid;gap:10px;min-width:0;counter-increment:s}
.step::before{content:counter(s);position:absolute;left:18px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:600;display:grid;place-items:center}
.step .where{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.step blockquote{margin:0;border-left:3px solid var(--line);padding:3px 0 3px 12px;font-size:.9rem}
.sub{display:grid;gap:6px;padding-top:4px}
.chain{margin:0;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-family:var(--f-mono);font-size:.76rem;line-height:1.55;overflow-x:auto;white-space:pre}
@media (max-width:520px){.step{padding:16px 14px 16px 14px}.step::before{position:static;margin-bottom:-4px}}

/* tables & chips */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
tr:last-child td{border-bottom:0}
td{font-variant-numeric:tabular-nums}
tr.keep td{background:var(--ok-soft)}
tr.drop td{color:var(--muted)}
tr.pick td{background:var(--accent-soft)}
tr.more td{color:var(--muted);font-size:.8rem;font-style:italic}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.7rem;padding:2px 8px;border-radius:99px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-off{background:var(--off-soft);color:var(--off)}
.c-acc{background:var(--accent-soft);color:var(--accent)}
tr.keep .c-ok,tr.pick .c-acc{background:var(--panel)}
.mini{display:inline-block;font-family:var(--f-mono);font-size:.68rem;padding:0 6px;border-radius:4px;margin:1px 2px 1px 0;white-space:nowrap}
.mini.ok{background:var(--ok-soft);color:var(--ok)}
.mini.bad{background:var(--bad-soft);color:var(--bad)}

/* answer key */
section..key{border:1px dashed var(--warn);border-radius:10px;padding:14px 18px;display:grid;gap:10px}
section..key button{justify-self:start;border:1px solid var(--warn);background:var(--warn-soft);color:var(--fg);border-radius:6px;padding:6px 14px;cursor:pointer}
section..key dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.88rem}
section..key dt{color:var(--muted);font-family:var(--f-mono);font-size:.74rem;padding-top:2px}
section..key dd{margin:0;overflow-wrap:anywhere}

/* engine decisions (decisions.js, written by engine/) */
.dc{display:inline-block;font-family:var(--f-mono);font-size:.7rem;font-weight:500;padding:1px 7px;border-radius:4px;white-space:nowrap;vertical-align:1px}
.dc-SAME_ENTITY{background:var(--bad-soft);color:var(--bad)}
.dc-DIFFERENT_ENTITY{background:var(--ok-soft);color:var(--ok)}
.dc-REVIEW{background:var(--warn-soft);color:var(--warn)}
.verdict{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--off);border-radius:10px;padding:16px 20px;display:grid;gap:12px}
.verdict.v-SAME_ENTITY{border-left-color:var(--bad)}
.verdict.v-DIFFERENT_ENTITY{border-left-color:var(--ok)}
.verdict.v-REVIEW{border-left-color:var(--warn)}
.verdict .big{font-family:var(--f-display);font-size:1.35rem;font-weight:600}
.verdict.v-SAME_ENTITY .big{color:var(--bad)}
.verdict.v-DIFFERENT_ENTITY .big{color:var(--ok)}
.verdict.v-REVIEW .big{color:var(--warn)}
.verdict dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:.88rem}
.verdict dt{color:var(--muted);font-family:var(--f-mono);font-size:.74rem;padding-top:2px}
.verdict dd{margin:0;overflow-wrap:anywhere}
.verdict ol{margin:0;padding-left:20px;display:grid;gap:3px;font-family:var(--f-mono);font-size:.76rem}
.idchip{display:inline-block;font-family:var(--f-mono);font-size:.74rem;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 6px;margin:1px 3px 1px 0}
.reasonline{font-family:var(--f-mono);font-size:.95rem}
/* predicted result: one coloured box, details folded */
.pred{border:1px solid var(--line);border-left-width:6px;border-radius:10px;padding:16px 20px;display:grid;gap:10px}
.pred.p-SAME_ENTITY{background:var(--bad-soft);border-color:var(--bad)}
.pred.p-DIFFERENT_ENTITY{background:var(--ok-soft);border-color:var(--ok)}
.pred.p-REVIEW{background:var(--warn-soft);border-color:var(--warn)}
.pred-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.pred-dec{font-family:var(--f-display);font-size:1.4rem;font-weight:600}
.p-SAME_ENTITY .pred-dec{color:var(--bad)}
.p-DIFFERENT_ENTITY .pred-dec{color:var(--ok)}
.p-REVIEW .pred-dec{color:var(--warn)}
.pred-code{font-family:var(--f-mono);font-size:1rem;font-weight:600}
.pred-also{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.pred p{margin:0}
.pred-label{font-size:.9rem}
.pred details summary{cursor:pointer;color:var(--accent);font-size:.88rem}
.pred .fold{padding:8px 0 4px;display:grid;gap:8px}
.pred ol{margin:0;padding-left:20px;display:grid;gap:3px;font-family:var(--f-mono);font-size:.76rem}
.pred dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:.86rem}
.pred dt{color:var(--muted);font-family:var(--f-mono);font-size:.72rem;padding-top:2px}
.pred dd{margin:0;overflow-wrap:anywhere}
.rk{display:inline-block;font-family:var(--f-mono);font-size:.72rem;font-weight:500;padding:1px 7px;border-radius:4px;white-space:nowrap;vertical-align:1px}
.rk-high{background:var(--bad-soft);color:var(--bad)}
.rk-medium{background:var(--warn-soft);color:var(--warn)}
.rk-low{background:var(--off-soft);color:var(--off)}
.drivers{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.86rem}
.drivers li{display:grid;grid-template-columns:3.4em 1fr;gap:8px;align-items:baseline}
.drivers .w{font-family:var(--f-mono);font-size:.76rem;text-align:right;font-variant-numeric:tabular-nums}
.drivers .w.pos{color:var(--bad)}
.drivers .w.neg{color:var(--ok)}
.flagchip{display:inline-block;font-family:var(--f-mono);font-size:.68rem;padding:1px 7px;border-radius:99px;background:var(--bad-soft);color:var(--bad);margin-right:4px}
.evlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.evlist li{border-left:3px solid var(--accent);padding:2px 0 2px 10px;font-size:.84rem;display:grid;gap:2px;min-width:0}
.evlist .k{font-weight:600}
.evlist .sm{color:var(--fg);overflow-wrap:anywhere}
.evlist .use{color:var(--muted);font-size:.8rem}
.evlist .use b{color:var(--fg);font-weight:500}
.both{font-family:var(--f-mono);font-size:.66rem;background:var(--ok-soft);color:var(--ok);border-radius:4px;padding:0 5px;margin-left:4px}
.only{font-family:var(--f-mono);font-size:.66rem;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 5px;margin-left:4px}
.mini.cited{background:var(--accent-soft);color:var(--accent)}
.vskey{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem}

/* raw */
.raw{display:grid;gap:8px}
.raw details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.raw summary{cursor:pointer;font-family:var(--f-mono);font-size:.8rem}
.raw .body{padding-top:10px;display:grid;gap:12px}
.kv{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:2px 14px;font-size:.82rem}
.kv dt{color:var(--muted);font-family:var(--f-mono);font-size:.74rem;padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.rawcard{border-top:1px solid var(--line);padding-top:8px}
.rawcard:first-child{border-top:0;padding-top:0}
.loading{color:var(--muted)}
.notes-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes-list li{font-size:.88rem;border-left:3px solid var(--line);padding-left:10px}
mark{background:var(--warn-soft);color:var(--fg);border-radius:3px;padding:0 2px}
</style>

<nav class="topnav" aria-label="Sections">
  <span class="navbrand">Assiduous</span>
  <a href="#overview" data-view="overview">Overview</a>
  <a href="#casebook" data-view="casebook">Casebook</a>
  <a href="#ai-review" data-view="ai">AI review<span class="soon">soon</span></a>
</nav>
<div class="app" id="app">
  <aside class="side" aria-label="Alerts">
    <div class="side-head">
      <div class="brand">Screening casebook</div>
      <label for="q" class="sr-only">Find an alert</label>
      <input id="q" type="search" placeholder="Alert ID, customer or hit name" autocomplete="off">
    </div>
    <ol id="list" class="list"></ol>
  </aside>
  <main id="main"><div class="case"><p class="loading">Loading 440 alerts…</p></div></main>
</div>
<div id="page" class="page" hidden></div>

<script src="data.js"></script>
<script src="decisions.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = {data:null, q:'', id:null, hit:0, person:0, manual:false};   // manual: is "Manual Review Details" open
const ENG = window.DECISIONS || null;    // set by decisions.js (engine/), optional
const engHit = id => ENG && ENG.hits[id];
const engAlert = id => ENG && ENG.alerts[id];
const dchip = (k, text) => `<span class="dc dc-${esc(k)}">${esc(text ?? k)}</span>`;
const splitCodes = v => Array.isArray(v) ? v : String(v ?? '').split(';').map(x => x.trim()).filter(Boolean);
const codes = xs => splitCodes(xs).map(esc).join(' · ');
const showEng = () => !!ENG;
// fraud-risk score (engine/screening/risk.py): beside the SOP decision, never changes it
const engRisk = id => engHit(id)?.risk || null;
// the percentage only; its colour carries the level for the listing type
const rchip = r => r ? `<span class="rk rk-${esc(r.risk_band)}" title="Fraud risk: modelled chance that the hit is the customer">${r.risk_pct}%</span>` : '';
const FLAG_TEXT = {identity_inconsistency:'record name matches the hit, KYC document does not', dob_near_identical:'date of birth nearly identical', native_alias_match:'matches a native-script alias'};    // predicted results always show when decisions.js is present
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CHIP = {'agrees':'c-ok','no conflict':'c-ok','contradicts':'c-bad','neither':'c-warn','too few parts':'c-warn','differs (name not verified)':'c-warn','no data':'c-off'};

const chip = (state, text) => `<span class="chip ${CHIP[state]||'c-off'}">${esc(text ?? state)}</span>`;
const fd = d => { if(!d) return '—'; const [y,m,dd] = String(d).split('-'); return dd ? `${+dd} ${MON[m-1]} ${y}` : m ? `${MON[m-1]} ${y}` : y; };
const fdl = t => String(t ?? '').replace(/\b\d{4}-\d{2}(-\d{2})?\b/g, fd);   // ISO dates inside a label, as 15 May 1988
const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;
const uniq = xs => [...new Set(xs.filter(Boolean))];
const table = (head, rows, cls='') => `<div class="tw"><table class="${cls}"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const kv = obj => `<dl class="kv">${Object.entries(obj||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;

/* ---------------- list ---------------- */
function matches(it){
  if (!S.q) return true;
  const hay = (it.id+' '+(it.name||'')+' '+it.hit_names.join(' ')).toLowerCase();
  return hay.includes(S.q);
}
function listRisk(it){
  // the alert's risk is its riskiest hit
  if (!showEng()) return '';
  const r = (S.data.cases[it.id]?.hits || []).map(h => engRisk(h.id)).filter(Boolean).sort((a, b) => b.risk_pct - a.risk_pct)[0];
  return rchip(r);
}
function renderList(){
  const items = S.data.index.filter(matches);
  $('#list').innerHTML = items.map(it => `<li><a href="#${esc(it.id)}" ${it.id===S.id?'aria-current="true"':''}>
    <span class="li-name">${esc(it.name)}</span>
    ${showEng() && engAlert(it.id) ? `<span class="li-tags">${dchip(engAlert(it.id))}${listRisk(it)}</span>` : ''}
    <span class="li-meta">${esc(it.id)} · ${plural(it.hits,'hit')}${it.link==='search'?' · no link':''}${it.type==='Company'?' · company':''}${it.people>1?` · ${it.people} people`:''}</span></a></li>`).join('')
    || '<li class="empty">No alerts match. Clear the search or pick another filter.</li>';
}

/* ---------------- the two sides ---------------- */
function custCard(c, p){
  const a = c.alert;
  if (!p) return `<div class="person cust"><span class="role">Our customer · the alert</span>
    <span class="who">${esc(a.customer_name)}</span>
    <ul><li>Screened as ${esc(a.entity_type)}${a.dob?`, born ${esc(fd(a.dob))}`:''}${a.country?`, ${esc(a.country)}`:''}${a.city?`, ${esc(a.city)}`:''}</li>
    <li>No customer record found. Only the screened details are known.</li></ul>
    <span class="src">${esc(a.alert_id)}</span></div>`;
  const r0 = c.records[p.records[0]] || {};
  const v = p.verified ? p.checks.find(x => x.src===p.verified) : null;
  const isCo = p.type==='Company';
  const cs = uniq(p.countries.map(x=>x.c));
  const co = uniq(p.coholders.map(x => (c.records[x.rid]||{}).full_name || x.rid));
  const li = [
    p.dob ? `${isCo?'Founded':'Born'} ${esc(fd(p.dob))} <span class="muted small">(${esc(p.dob_src)})</span>` : `${isCo?'Founding date':'Birth date'} unknown`,
    cs.length ? `Tied to ${esc(cs.join(', '))}` : 'No country on file',
    [r0.occupation, r0.employer].filter(Boolean).length ? esc([r0.occupation, r0.employer].filter(Boolean).join(', ')) : '',
    v ? `Verified: ${esc(v.doc||'ID')}${v.country?` from ${esc(v.country)}`:''}, ${esc(v.provider||'')} ${esc(v.date||'')}` : 'No approved identity check',
    p.records.length>1 ? `${p.records.length} customer records, merged as one person` : '',
    co.length ? `Shares an account with ${esc(co.join(', '))}` : '',
  ].filter(Boolean);
  const accs = uniq(c.resolution.links.flatMap(l => l.path.map(x => x.account)).filter(Boolean));   // the account the alert's link names
  return `<div class="person cust"><span class="role">Our customer · the alert</span>
    <span class="who">${esc(p.name)}</span><ul>${li.map(x=>`<li>${x}</li>`).join('')}</ul>
    <span class="src">${esc([a.alert_id, ...accs, p.records.join(', ')].join(' · '))}</span></div>`;
}
function hitCard(h){
  const r = h.row;
  const cs = uniq(h.countries.map(x=>x.c));
  const li = [
    r.position_or_allegation ? esc(r.position_or_allegation.slice(0,240)) : '',
    cs.length ? `Tied to ${esc(cs.join(', '))}` : 'No country in the profile',
    h.dob_entries.length ? `Born ${esc(h.dob_entries.map(e=>fdl(e.label)).join('; '))} <span class="muted small">(${esc(h.dob_source)})</span>` : 'No birth date in the profile or in qualifying search results',
    [r.entity_type, r.gender].filter(Boolean).join(', '),
    h.deceased ? `Died ${esc(fd(h.deceased))}` : (r.life_status ? esc(r.life_status) : ''),
    h.names.length>1 ? `Also known as ${esc(h.names.slice(1,4).join('; '))}${h.names.length>4?` and ${h.names.length-4} more`:''}` : '',
  ].filter(Boolean);
  return `<div class="person hit"><span class="role">Watchlist entry · the hit</span>
    <span class="who">${esc(r.name)}</span>
    <p class="cathelp"><b>${esc(h.category||'Watchlist')}.</b> ${esc(h.category_help)}</p>
    <ul>${li.map(x=>`<li>${x}</li>`).join('')}</ul><span class="src">${esc(h.id)}</span></div>`;
}

/* ---------------- step 1: account of the alert ---------------- */
const CHECK_LABEL = {name:'name',dob:'DOB',country:'country',city:'city',type:'type'};
function checkMinis(ch){
  return Object.entries(ch).filter(([,v])=>v!=='n/a').map(([k,v]) => `<span class="mini ${v==='yes'?'ok':'bad'}">${CHECK_LABEL[k]} ${v==='yes'?'✓':'✗'}</span>`).join('');
}
function candRows(c, cands, chosenIds){
  return cands.map(x => { const r = c.records[x.rid]||{}; const pick = chosenIds.has(x.rid);
    return `<tr class="${pick?'pick':(x.fits?'keep':'drop')}"><td class="mono">${esc(x.rid)}</td><td>${esc(r.full_name)}${r.preferred_name?` <span class="muted">(${esc(r.preferred_name)})</span>`:''}</td><td>${esc(r.dob)}</td><td>${esc(uniq([r.nationality,r.residence_country]).join(' / '))}</td><td>${esc(r.city)}</td><td>${checkMinis(x.checks)}</td></tr>`;}).join('');
}
/* The link chain: Login: x ──▶ ACC-… ──▶ CUS-… (one line per account) */
const LINK_WORD = {account_ref:'account', login_handle:'login', email:'email'};
function chainLines(l){
  // start from what the alert carries, end with the customer IDs
  const arrow = {account_ref: 'Account Num: ', login_handle: `Login: ${l.value} ──▶ `, email: `Email: ${l.value} ──▶ `}[l.kind];
  if (l.kind==='email') return [arrow + (l.path.length ? l.path.map(x=>x.customer).join(' + ') : 'no customer found')];
  if (!l.path.length) return [arrow + (l.kind==='account_ref' ? `${l.value} ──▶ no customer found` : 'no account found')];
  const by = {};
  for (const x of l.path) (by[x.account] ||= []).push(x.customer);
  return Object.entries(by).map(([acc, cs]) => `${arrow}${acc} ──▶ ${cs.join(' + ')}${cs.length>1 ? '  (joint account)' : ''}`);
}
function listWord(xs, w){ return xs.length<2 ? xs.join('') : xs.slice(0,-1).join(', ') + ` ${w} ` + xs[xs.length-1]; }
function listAnd(xs){ return listWord(xs, 'and'); }
function stepFind(c){
  const a = c.alert, res = c.resolution, linked = res.mode==='linked';
  const chosen = new Set(c.people.flatMap(p=>p.records));
  const head = ['Record','Name','Born','Nationality / residence','City','Matches the alert?'];
  const base = linked ? res.candidates : res.named_rows;
  const rest = linked ? 0 : res.named_total - res.named_rows.length;
  const moreRow = rest>0 ? `<tr class="more"><td colspan="6">+ ${plural(rest,'more record')} with an agreeing name, failing as many checks or more</td></tr>` : '';
  // what the alert itself says: the screened details, and the ones it leaves out
  const isCo = a.entity_type==='Company';
  const given = [a.dob && `${isCo?'founded':'born'} ${a.dob}`, a.country, a.city].filter(Boolean);
  const missing = [!a.dob && (isCo?'founding date':'birth date'), !a.country && 'country', !a.city && 'city'].filter(Boolean);
  const screened = `The bank screened ${[a.customer_name, ...given].join(', ')}.${missing.length ? ` The alert gives no ${listWord(missing, 'or')}.` : ''}`;
  let lead;
  if (linked) {
    const n = res.candidates.length;
    const leads = n===0 ? 'which leads to no customer record' : `which leads to the ${n===1 ? 'record' : n+' records'} below`;
    lead = `<p>${esc(screened)} It carries ${esc(listAnd(res.links.map(l => `the ${LINK_WORD[l.kind]} ${l.value}`)))}, ${leads}.</p><pre class="chain">${esc(res.links.flatMap(chainLines).join('\n'))}</pre>`;
  } else {
    // one line per search step, with the screened value it tests
    const step = {'name agrees': `named ${a.customer_name}`, 'same type': a.entity_type==='Company' ? 'companies' : 'individuals',
                  'date of birth fits': `born ${a.dob}`, 'country fits': `tied to ${a.country}`, 'city fits': `in ${a.city}`};
    const chain = ['No account, login or email ──▶ name search', ...res.funnel.map(f => `  ──▶ ${f.n} ${step[f.label] || f.label}`)].join('\n');
    lead = `<p>${esc(screened)} It carries no account, login or email. So the rules say: search every customer by name, then keep the records that fit. The table shows the records with the name, best fit first.</p><pre class="chain">${esc(chain)}</pre>`;
  }
  return `<li class="step"><h3>Account Details of the alert</h3>${lead}${table(head, [candRows(c, base, chosen) + moreRow])}</li>`;
}

/* ---------------- step 2: same person, other records ---------------- */
/* One row per record section 1 does not show: more records of the same person, and phone-sharers kept apart.
   Chips say which rule ties each row (SOP principle 3). */
function stepSame(c, p){
  if (!p || (!p.merges.length && !p.family.length)) return '';
  const R = id => c.records[id] || {};
  const phoneOf = {}, docOf = {};
  for (const e of [...p.merges, ...p.family]) if (e.phone) { phoneOf[e.a] = e.phone[0]; phoneOf[e.b || e.rid] = e.phone[1]; }
  for (const e of p.merges) if (e.doc) e.checks.forEach((k, i) => { if (k) docOf[[e.a, e.b][i]] = `${k.type||'ID'} ${e.doc}${k.country ? ` (${k.country})` : ''}`; });
  const mk = (ok, w) => `<span class="mini ${ok?'ok':'bad'}">${w} ${ok?'✓':'✗'}</span>`;
  const verdict = same => `<span class="mini ${same?'ok':'bad'}"><b>${same ? 'same person' : 'different person'}</b></span>`;
  const row = (rid, cls, hint) => { const r = R(rid);
    return `<tr class="${cls}"><td class="mono">${esc(rid)}</td><td>${esc(r.full_name)}${r.preferred_name ? ` <span class="muted">(${esc(r.preferred_name)})</span>` : ''}</td><td>${esc(r.dob||'—')}</td><td>${esc(phoneOf[rid] || r.phone || '—')}</td><td>${esc(docOf[rid] || '—')}</td><td>${hint}</td></tr>`; };
  // skip records section 1 already shows
  const res = c.resolution, inFind = new Set((res.mode==='linked' ? res.candidates : res.named_rows).map(x => x.rid));
  const rows = [
    ...p.merges.filter(e => !inFind.has(e.b)).map(e => row(e.b, 'pick', (e.doc ? mk(true, 'same document') : mk(true, 'same phone') + mk(true, 'same birth date')) + verdict(true))),
    ...p.family.filter(f => !inFind.has(f.rid)).map(f => row(f.rid, 'drop', mk(true, 'same phone') + mk(false, 'same birth date') + verdict(false))),
  ];
  if (!rows.length) return '';
  return `<li class="step"><h3>Other Records this bank holds under the same person</h3>${table(['Record','Name','Born','Phone','ID document','Same person?'], [rows.join('')])}</li>`;
}

/* ---------------- step 3: verified identity ---------------- */
function stepIdentity(c, p, h){
  if (!p) return '';
  const rows = p.checks.slice().sort((x,y)=>(y.date||'').localeCompare(x.date||'')).map(k => {
    const latest = k.src===p.verified;
    const res = k.result==='approved' ? chip('agrees', latest?'approved · latest':'approved') : chip('contradicts', k.result);
    return `<tr class="${latest?'keep':(k.result!=='approved'?'drop':'')}"><td class="mono">${esc(k.src)}${h?cited(h,k.src):''}</td><td>${k.kind==='kyc'?'KYC tab':'note'}</td><td>${esc(k.provider)}</td><td>${esc(k.name)}</td><td>${esc(k.dob_raw||k.dob)}</td><td>${esc(k.doc)}${k.doc_number?` <span class="mono">${esc(k.doc_number)}</span>`:''}</td><td>${esc(k.country)}</td><td>${esc(k.date)}</td><td>${res}</td></tr>`;}).join('');
  const v = p.verified ? p.checks.find(x=>x.src===p.verified) : null;
  const noteQuote = v && v.kind==='note' ? `<blockquote>${esc(v.text)}</blockquote>` : '';
  const lead = v ? ''
                 : `<p>No approved identity check exists for this person. The record's own details are all there is.</p>`;
  return `<li class="step"><h3>KYC details</h3>${lead}${noteQuote}${p.checks.length ? table(['Check','Where','Provider','Name','Born','Document','Country','Date','Result'],[rows]) : ''}</li>`;
}

/* ---------------- step 4: the hit ---------------- */
function stepHit(h){
  const r = h.row;
  const yes = b => b ? '<span class="mini ok">✓</span>' : '<span class="mini bad">✗</span>';
  const parts = [];
  // one table of facts the hit gives; a birth date names its source, since the SOP ranks them
  const quote = t => `<span class="small muted">“${esc(t)}”</span>`;
  const dobSrc = {
    'dobs field': () => '<span class="mono">dobs</span> field',
    'profile notes': () => `profile notes: ${quote(h.profile_age.text)}`,
    'search results': () => `search result ${esc(uniq(h.dob_entries.map(e => e.src)).join(', '))}`,
  };
  // only facts the hit gives
  const facts = h.dob_entries.length ? [[r.entity_type==='Company' ? 'Founded' : 'Born', esc(h.dob_entries.map(e => fdl(e.label)).join('; ')) + (h.dob_source ? ` <span class="small muted">(${dobSrc[h.dob_source]()})</span>` : '')]] : [];
  const byCountry = {};
  for (const x of h.countries) (byCountry[x.c] ||= []).push(x.src);
  for (const cn of Object.keys(byCountry)) facts.push(['Country', esc(cn)]);
  if (h.earliest) facts.push(['Earliest dated report', `${esc(fd(h.earliest.date))} ${quote(h.earliest.line)}`]);
  if (h.deceased) facts.push(['Died', esc(fd(h.deceased))]);
  if (facts.length) parts.push(table(['Fact', 'What the hit says'], [facts.map(([f, v]) => `<tr><td>${f}</td><td>${v}</td></tr>`).join('')]));
  // search
  if (h.search.length) {
    const rows = h.search.map(s => `<tr class="${s.about_hit?'keep':'drop'}"><td class="mono">${esc(s.result_id)}${cited(h,s.result_id)}</td><td>${esc(s.snippet)}</td><td>${yes(s.phrase_ok)}</td><td>${s.countries.length?esc(s.countries.join(', ')):'—'} ${yes(s.country_ok.length)}</td><td>${s.years?`${s.age} in ${s.year} → ${s.years[0]}/${s.years[1]}`:'—'}</td><td>${s.about_hit?chip('agrees','about the hit'):chip('no data','namesake')}</td></tr>`);
    parts.push(`<div class="sub"><h4>Web search results for “${esc(h.query)}”</h4>${table(['Result','Snippet',`Says “${h.phrase}”?`,'Country','Age → born','Hint'], rows)}</div>`);
  } else {
    parts.push(`<div class="sub"><h4>Web search results</h4><p class="small muted">None filed under “${esc(h.query)}”.</p></div>`);
  }
  return `<li class="step"><h3>Read what the hit says</h3>${parts.join('')}<span class="where">Hits · Search results</span></li>`;
}

/* ---------------- step 5: compare ---------------- */
function stepCompare(c, p, h, cmp){
  const isCo = (p?.type || c.alert.entity_type)==='Company';
  const nm = cmp.name.match;
  const pairs = nm && nm.pairs.length ? nm.pairs.map(([x,y,how])=>`${esc(x)} ↔ ${esc(y)} <span class="muted">(${esc(how)})</span>`).join('; ') : 'no parts match';
  const nameCust = nm ? `${esc(nm.a)} <span class="muted small">(${cmp.name.verified?'verified':'not verified'})</span>` : '—';
  const nameHit = nm ? esc(nm.b) : esc(h.row.name);
  const dobPer = cmp.dob.per.map(x=>`${esc(fdl(x.label))} ${chip(x.state)}`).join(' ');
  const timeTxt = cmp.time.reasons.length ? esc(cmp.time.reasons.join('; ')) : (h.earliest ? `earliest dated report ${esc(fd(h.earliest.date))}` : '') + (h.deceased ? `${h.earliest?'; ':''}died ${esc(fd(h.deceased))}` : '');
  const rows = [
    `<tr><td>Person or company</td><td>${esc(cmp.type.cust)}</td><td>${esc(cmp.type.hit)}</td><td>${chip(cmp.type.state)}</td></tr>`,
    `<tr><td>Name</td><td>${nameCust}</td><td>${nameHit}</td><td>${chip(cmp.name.state)}<div class="small muted">${pairs}</div></td></tr>`,
    `<tr><td>${isCo?'Founded':'Born'}</td><td>${esc(fd(cmp.dob.cust))} <span class="muted small">(${esc(cmp.dob.cust_src||'')})</span></td><td>${cmp.dob.per.length?dobPer:'—'} ${cmp.dob.hit_source?`<span class="muted small">(${esc(cmp.dob.hit_source)})</span>`:''}</td><td>${chip(cmp.dob.state)}</td></tr>`,
    `<tr><td>Country</td><td>${esc(cmp.country.cust.join(', ')||'—')}</td><td>${esc(cmp.country.hit.join(', ')||'—')}</td><td>${chip(cmp.country.state)}${cmp.country.shared.length?`<div class="small muted">shared: ${esc(cmp.country.shared.join(', '))}</div>`:''}</td></tr>`,
    `<tr><td>Time</td><td>${isCo?'incorporation':'age at reports'}</td><td>${timeTxt||'—'}</td><td>${chip(cmp.time.state)}</td></tr>`,
  ];
  return `<li class="step"><h3>Compare the facts</h3>${table(['Fact','Our customer','The hit','Hint'], rows)}</li>`;
}

/* ---------------- the engine's decision ---------------- */
const ids = xs => (xs||[]).map(x => `<span class="idchip">${esc(x)}</span>`).join('') || '<span class="muted">none</span>';
function evidenceList(idsIn, detail, otherIds, otherName){
  if (!idsIn.length) return '<p class="small muted">No evidence cited.</p>';
  return `<ul class="evlist">${idsIn.map(id => {
    const d = (detail||{})[id] || {kind:'Record', summary:'', used_for:[], also_has:[]};
    const tag = otherIds ? (otherIds.includes(id) ? '<span class="both">in both</span>' : `<span class="only">not in ${esc(otherName)}</span>`) : '';
    const use = d.used_for.length ? `<span class="use"><b>Used for:</b> ${esc(d.used_for.join('; '))}</span>`
      : d.also_has.length ? `<span class="use"><b>Contains:</b> ${esc(d.also_has.join('; '))}</span>` : '';
    return `<li><span><span class="idchip">${esc(id)}</span> <span class="k">${esc(d.kind)}</span>${tag}</span><span class="sm">${esc(d.summary)}</span>${use}</li>`;
  }).join('')}</ul>`;
}
function resultDetail(c, h){
  const e = engHit(h.id);
  if (!showEng() || !e) return '';
  const l = h.label, labelIds = l ? splitCodes(l.evidence) : null;
  const fold = (title, body) => `<details><summary>${esc(title)}</summary><div class="fold">${body}</div></details>`;
  const ids = e.customer_record_ids;
  const cust = !ids.length ? 'none found' : ids[0]==='AMBIGUOUS'
    ? `AMBIGUOUS${c.people.length>1 ? ` (${c.people.length} people fit)` : ''}` : ids.map(x => `<span class="idchip">${esc(x)}</span>`).join('');
  const how = e.methods && e.methods.length ? `<dt>extraction</dt><dd>${esc(e.methods.join(', '))}</dd>` : '';
  const also = e.reason_codes.length>1 ? `<span class="pred-also">also ${codes(e.reason_codes.slice(1))}</span>` : '';
  const tick = (ok, w) => `<span class="mini ${ok?'ok':'bad'}">${w} ${ok?'✓':'✗'}</span>`;
  const v = e.vs_label;
  const r = engRisk(h.id);
  const clash = r && e.decision === 'DIFFERENT_ENTITY' && r.risk_band === 'high'
    ? `<p class="pred-label"><b>Cleared under the SOP, but the risk model puts the chance this is the customer at ${r.risk_pct}%.</b> The decision stands; a person may want to look.</p>` : '';
  const label = l ? `<p class="pred-label">Practice label: <b>${esc(l.decision)}</b> · ${codes(l.reason_codes)} ${v ? tick(v.decision,'decision') + tick(v.reason,'reason') : tick(l.decision===e.decision,'decision')}</p>` : '';
  return `<section class="pred p-${esc(e.decision)}" aria-label="Predicted result for ${esc(h.id)}">
    <div class="pred-head"><span class="pred-dec">${esc(e.decision)}</span><span class="pred-code">${esc(e.reason_codes[0]||'—')}</span>${also}${r ? `<span class="small">Fraud risk ${rchip(r)}</span>` : ''}</div>
    <p>${esc(e.reason)}</p>
    ${label}${clash}
    ${fold(`Evidence (${e.evidence.length})`, `<dl><dt>customer</dt><dd>${cust}</dd>${how}</dl>${evidenceList(e.evidence, e.evidence_detail, labelIds, 'practice label')}`)}
    ${r ? fold(`Fraud risk: ${r.risk_pct}% chance this hit is the customer`, riskBody(h, r)) : ''}
  </section>`;
}

function riskBody(h, r){
  const cat = h.category || 'Other';
  const drivers = r.risk_drivers.map(t => {
    const m = t.match(/^(.*) \(([+-]\d+\.\d)\)$/);
    const txt = m ? m[1] : t, w = m ? parseFloat(m[2]) : 0;
    return `<li><span class="w ${w > 0 ? 'pos' : w < 0 ? 'neg' : ''}">${m ? m[2] : ''}</span><span>${esc(txt)}</span></li>`;
  }).join('');
  const flags = r.risk_flags.map(f => `<span class="flagchip">${esc(FLAG_TEXT[f] || f)}</span>`).join('');
  return `${flags ? `<div>${flags}</div>` : ''}<ul class="drivers">${drivers}</ul>
    <p class="small muted">Each line adds to or takes from the starting odds (about 15%); positive lines point to the same person. The colour reflects the listing type: a sanctions hit turns red at a lower percentage than adverse media. The weights are set by judgement, not fitted to outcomes, so use it to rank and triage. It never changes the SOP decision.</p>`;
}

/* where a cited record appears in the steps, mark it */
const cited = (h, id) => showEng() && engHit(h.id)?.evidence.includes(id) ? ' <span class="mini cited eng">cited</span>' : '';

/* ---------------- answer key & raw ---------------- */
function answerKey(h){
  if (!h.label) return '';
  const l = h.label;
  const v = showEng() && engHit(h.id)?.vs_label;
  const tick = (ok, w) => `<span class="mini ${ok?'ok':'bad'}">${w} ${ok?'✓':'✗'}</span>`;
  const vs = v ? `<dt>predicted vs true</dt><dd class="vskey eng">${tick(v.decision,'decision')}${tick(v.reason,'reason')}${tick(v.customer,'customer')}<span class="small muted">evidence ${Math.round(v.evidence_precision*100)}% precise, ${Math.round(v.evidence_recall*100)}% complete</span></dd>` : '';
  return `<section class="key" aria-label="Answer key"><h2>Answer key</h2><p class="small">This hit is one of the 50 practice labels. Try it yourself first.</p>
    <button type="button" data-reveal>Show the answer key</button>
    <div id="keybody" hidden><dl><dt>decision</dt><dd><b>${esc(l.decision)}</b></dd><dt>reason codes</dt><dd>${esc(l.reason_codes)}</dd><dt>customer</dt><dd>${esc(l.customer_record_ids)}</dd><dt>evidence</dt><dd>${esc(l.evidence)}</dd><dt>reason</dt><dd>${esc(l.reference_reason)}</dd><dt>path</dt><dd>${esc(l.path)}</dd>${vs}</dl></div></section>`;
}
function rawSection(c, p, h){
  const rec = Object.entries(c.records).map(([id,r])=>`<div class="rawcard"><b class="mono">${esc(id)}</b>${kv(r)}</div>`).join('');
  const sec = (title, body) => body ? `<details><summary>${esc(title)}</summary><div class="body">${body}</div></details>` : '';
  const list = (xs) => xs.map(x=>`<div class="rawcard">${kv(x)}</div>`).join('');
  const hitRow = {...h.row}; delete hitRow.profile_notes;
  return `<section class="raw"><h2>The raw rows</h2>
    ${sec('Alert row', kv(c.alert))}
    ${sec(`Hit row ${h.id}`, kv(hitRow) + (h.row.profile_notes ? `<div class="rawcard"><b>profile_notes</b><p class="small" style="white-space:pre-wrap">${esc(h.row.profile_notes)}</p></div>` : ''))}
    ${sec(`Customer records (${Object.keys(c.records).length})`, rec)}
    ${p ? sec(`Accounts (${p.accounts.length})`, list(p.accounts)) : ''}
    ${p ? sec(`Onboarding (${p.onboarding.length})`, list(p.onboarding)) : ''}
    ${p ? sec(`KYC checks (${p.kyc.length})`, list(p.kyc)) : ''}
    ${p ? sec(`Notes (${p.notes.length})`, list(p.notes)) : ''}
    ${sec(`Search results (${h.search.length})`, list(h.search.map(s=>({result_id:s.result_id, query:s.query, title:s.title, snippet:s.snippet, source:s.source}))))}
  </section>`;
}

/* ---------------- one case ---------------- */
function renderCase(){
  const c = S.data.cases[S.id];
  const main = $('#main');
  if (!c) { main.innerHTML = `<div class="case"><p>No alert called ${esc(S.id)}. Pick one from the list.</p></div>`; return; }
  const a = c.alert, hits = c.hits, people = c.people;
  const h = hits[Math.min(S.hit, hits.length-1)];
  const pi = Math.min(S.person, Math.max(people.length-1,0));
  const p = people[pi] || null;
  const cmp = h ? h.compare[Math.min(pi, h.compare.length-1)] : null;
  const custName = p ? p.name : a.customer_name;
  const q = `Is ${custName} this watchlist entry?`;
  const flags = [];
  if (people.length>1) flags.push(`<p class="flag warn">${people.length} people fit this alert. The rules say: decide the hit for each person. If they lead to different decisions, the answer is REVIEW with AMBIGUOUS_CUSTOMER_RECORD.</p>`);
  if (!people.length) flags.push(`<p class="flag bad">No customer record fits this alert. The comparison below uses the screened details only.</p>`);
  const hitTabs = hits.length>1 ? `<div class="tabrow"><span class="eyebrow">Hits on this alert</span><div class="tabs">${hits.map((x,i)=>`<button type="button" data-hit="${i}" aria-pressed="${x===h}"><span class="t1">${esc(x.row.name)}</span><span class="t2">${showEng() && engHit(x.id) ? dchip(engHit(x.id).decision) + ' ' + rchip(engRisk(x.id)) + ' ' + esc(engHit(x.id).reason_codes[0]) + ' · ' : ''}${esc(x.id)} · ${esc(x.category||'')}${x.label?' · key':''}</span></button>`).join('')}</div></div>` : '';
  const personTabs = people.length>1 ? `<div class="tabrow"><span class="eyebrow">People who fit</span><div class="tabs">${people.map((x,i)=>`<button type="button" data-person="${i}" aria-pressed="${i===pi}"><span class="t1">${esc(x.name)}</span><span class="t2">${esc(x.records.join(', '))}</span></button>`).join('')}</div></div>` : '';
  main.innerHTML = `<div class="case">
    <header class="ch">
      <h1>${esc(q)}</h1>
      <div class="caseid">${esc(a.alert_id)}</div>
      ${flags.join('')}</header>
    ${hitTabs}${personTabs}
    <div class="duo">${custCard(c,p)}${hitCard(h)}</div>
    ${resultDetail(c, h)}
    <details class="manual" ${S.manual ? 'open' : ''}><summary>Manual Review Details</summary><div class="body">
      <section><ol class="steps">
        ${stepFind(c)}${stepSame(c,p)}${stepIdentity(c,p,h)}${stepHit(h)}${stepCompare(c,p,h,cmp)}
      </ol></section>
      ${answerKey(h)}
      ${rawSection(c,p,h)}
    </div></details>
  </div>`;
}

/* ---------------- overview (cover page) ---------------- */
function overviewPage(){
  const arrow = (d, cls = 'ov-edge') => `<path class="${cls}" d="${d}" marker-end="url(#${cls === 'ov-loop' ? 'ov-arrow-ai' : 'ov-arrow'})"/>`;
  const node = (cx, cy, w, text, cls) => `<rect class="${cls}" x="${cx - w / 2}" y="${cy - 19}" width="${w}" height="38" rx="${cls === 'ov-q' ? 19 : 8}"/>
    <text class="${cls === 'ov-q' ? 'ov-qt' : 'ov-lt'}" x="${cx}" y="${cy + 5}">${text}</text>`;
  const lbl = (x, y, t) => `<text class="ov-yn" x="${x}" y="${y}">${t}</text>`;
  const box = (x, title) => `<rect class="ov-box" x="${x}" y="20" width="340" height="300" rx="14"/>
    <text class="ov-title" x="${x + 24}" y="56">${title}</text>`;
  // evidence weighting: bars from an axis, 15px per unit of log-odds (weights from engine/screening/risk.py)
  const AX = 640, U = 15;
  const bar = (y, label, w) => `<text class="ov-bl" x="452" y="${y + 5}">${label}</text>
    <rect class="${w > 0 ? 'ov-pos' : 'ov-neg'}" x="${w > 0 ? AX : AX + w * U}" y="${y - 9}" width="${Math.abs(w) * U}" height="18" rx="3"/>`;
  const point = (y, text) => `<circle class="ov-dot" cx="866" cy="${y - 5}" r="5"/><text class="ov-pt" x="882" y="${y}">${text}</text>`;
  return `<header class="ov-head">
      <h1>Assidous.AI</h1>
      <div class="ov-words"><span>Consistency</span><span>Explainability</span></div>
    </header>
    <div class="ov-diagram"><svg viewBox="0 0 1200 420" role="img" aria-label="Policy decision tree, then evidence weighting, then AI review, which loops back to refine the policy decision tree">
      <defs>
        <marker id="ov-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ov-tip" d="M0,0 L10,5 L0,10 z"/></marker>
        <marker id="ov-arrow-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ov-tip-ai" d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>

      ${box(20, 'Policy Decision Tree')}
      ${arrow('M190,129 L110,184')}${lbl(132, 150, 'yes')}
      ${arrow('M190,129 L265,184')}${lbl(246, 150, 'no')}
      ${arrow('M265,224 L210,264')}${lbl(225, 242, 'yes')}
      ${arrow('M265,224 L308,264')}${lbl(300, 242, 'no')}
      ${node(190, 110, 170, 'Contradiction?', 'ov-q')}
      ${node(105, 205, 150, 'DIFFERENT_ENTITY', 'ov-leaf ov-d')}
      ${node(265, 205, 140, 'Agreement?', 'ov-q')}
      ${node(205, 284, 120, 'SAME_ENTITY', 'ov-leaf ov-s')}
      ${node(312, 284, 84, 'REVIEW', 'ov-leaf ov-r')}

      ${box(430, 'Evidence Weighting')}
      <line class="ov-axis" x1="${AX}" y1="80" x2="${AX}" y2="250"/>
      ${bar(100, 'Name', 2.5)}
      ${bar(140, 'Birth date', 3.0)}
      ${bar(180, 'Country', 0.8)}
      ${bar(220, 'Impossible', -5)}
      <text class="ov-sub" x="600" y="290">chance it is the customer (%)</text>

      ${box(840, 'AI review')}
      ${point(120, 'reads each case and its evidence')}
      ${point(170, 'flags edge cases')}
      ${point(220, 'suggests rule changes')}

      ${arrow('M360,170 H426')}
      ${arrow('M770,170 H836')}
      ${arrow('M1010,320 V390 H190 V324', 'ov-loop')}
    </svg></div>`;
}

/* ---------------- AI review: blank for now ---------------- */
function aiPage(){
  return '';
}

/* ---------------- wiring ---------------- */
function currentView(){
  const h = decodeURIComponent(location.hash.slice(1));
  return !h || h === 'overview' ? 'overview' : h === 'ai-review' ? 'ai' : 'casebook';
}
function route(){
  const v = currentView();
  document.querySelectorAll('.topnav a').forEach(a => a.setAttribute('aria-current', a.dataset.view === v ? 'page' : 'false'));
  $('#app').hidden = v !== 'casebook';
  $('#page').hidden = v === 'casebook';
  if (v !== 'casebook') { $('#page').innerHTML = v === 'overview' ? overviewPage() : aiPage(); window.scrollTo(0, 0); return; }
  const h = decodeURIComponent(location.hash.slice(1));
  const id = h === 'casebook' ? (S.id || '') : h;
  const changed = id !== S.id;
  S.id = S.data.cases[id] ? id : (S.data.index.find(matches)||S.data.index[0]).id;
  if (changed) { S.hit = 0; S.person = 0; }
  renderList(); renderCase();
  if (changed) window.scrollTo(0,0);
}
document.addEventListener('click', e => {
  const hb = e.target.closest('[data-hit]');
  if (hb) { S.hit = +hb.dataset.hit; renderCase(); return; }
  const pb = e.target.closest('[data-person]');
  if (pb) { S.person = +pb.dataset.person; renderCase(); return; }
  const rv = e.target.closest('[data-reveal]');
  if (rv) { const b = $('#keybody'); b.hidden = !b.hidden; rv.textContent = b.hidden ? 'Show the answer key' : 'Hide the answer key'; }
});
$('#q').addEventListener('input', e => { S.q = e.target.value.trim().toLowerCase(); renderList(); });
$('#q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const typed = e.target.value.trim().toUpperCase();
  const hit = S.data.index.find(it => it.id.toUpperCase() === typed) || S.data.index.find(matches);
  if (!hit) return;
  if (location.hash === '#' + hit.id) route(); else location.hash = hit.id;
  $('#main').scrollIntoView({block: 'start'});
});
window.addEventListener('hashchange', route);
// keep "Manual Review Details" open or closed as you move between alerts ('toggle' does not bubble, so capture it)
document.addEventListener('toggle', e => { if (e.target.classList?.contains('manual')) S.manual = e.target.open; }, true);

const d = window.CASEBOOK;   // set by data.js
if (d) {
  S.data = d;
  route();
} else {
  $('#main').innerHTML = `<div class="case"><p class="flag bad">Could not load data.js. Run build_casebook.py, then open this page next to the data.js it writes.</p></div>`;
}
</script>
